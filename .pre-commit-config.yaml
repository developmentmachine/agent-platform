repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: lintlang
        name: lintlang
        entry: uv run lintlang scan --fail-on fail
        language: system
        types_or: [yaml, json, markdown, text]
