[project]
name = "agent-platform"
version = "1.0.0"
description = "Agent Platform：多智能体运行平台（CLI/HTTP/调度/IM）。内置 stock-recap（A 股日终复盘/次日策略）与 hsk30-tutor（HSK 3.0 中文陪练）。"
requires-python = ">=3.10"
dependencies = [
    "akshare",
    "apscheduler>=3.10.0",
    "cryptography>=46.0.7",
    "duckduckgo-search>=6.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "mcp>=1.8.0",
    "openai>=1.40.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pytz>=2024.1",
    "pyyaml>=6.0",
    "qdrant-client>=1.11.0",
    "qq-botpy>=1.2.1",
    "tenacity>=8.3.0",
    "uvicorn[standard]>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_platform/infra/policy/rules.yaml" = "agent_platform/infra/policy/rules.yaml"

# 下游包可扩展 Skills：在 wheel 的 pyproject 中声明
#   [project.entry-points."agent_platform.skills"]
#   acme = "acme_recap_skills:bundle_root"   # Path | str | () -> Path | str
#
# 下游包可扩展 Agent：在 wheel 的 pyproject 中声明
#   [project.entry-points."agent_platform.agents"]
#   my_agent = "my_pkg.manifest:register"   # register(AgentRegistry) -> None
[project.scripts]
agent_platform = "agent_platform.adapters.cli.main:cli_main"
agent-platform = "agent_platform.adapters.cli.main:cli_main"
stock-recap-mcp = "agent_platform.interfaces.mcp_stdio:main"
agent-platform-tools-mcp = "agent_platform.tools_server:run_server"
agent-platform-qq-bot = "agent_platform.adapters.qq.__main__:main"
agent-platform-wecom-bot = "agent_platform.adapters.wecom.__main__:main"

# 内置 Agent 通过本 entry_point 自动被 ``runtime.discover_agents`` 发现；
# ``factory._register_builtin_agents`` 已显式调用一次，两条路径都 OK，便于 editable install。
[project.entry-points."agent_platform.agents"]
stock-recap = "agent_platform.agents.stock_recap.manifest:register"
hsk30-tutor = "agent_platform.agents.hsk30_tutor.manifest:register"

[project.entry-points."agent_platform.prompts"]
stock-recap = "agent_platform.agents.stock_recap.prompts:bundle_root"

[project.entry-points."agent_platform.skills"]
stock-recap = "agent_platform.agents.stock_recap.skills:bundle_root"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "import-linter>=2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "import-linter>=2.0",
]

# ───────────────────────────────────────────────────────────────────────
# 架构边界：import-linter 强制（CI 跑 `lint-imports`）
# ───────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = ["agent_platform"]

[[tool.importlinter.contracts]]
name = "core 不依赖任何上层"
type = "forbidden"
source_modules = ["agent_platform.core"]
forbidden_modules = [
    "agent_platform.runtime",
    "agent_platform.infra",
    "agent_platform.adapters",
    "agent_platform.agents",
    "agent_platform.tools_server",
    "agent_platform.application",
    "agent_platform.infrastructure",
    "agent_platform.interfaces",
]
# 例外：core.runtime 暂从 ``domain`` re-export RunContext，待物理迁移后取消；
# core.orchestration.outbox 是 shim，re-export application.side_effects.outbox。
ignore_imports = [
    "agent_platform.core.runtime.contextvars -> agent_platform.runtime.observability.runtime_context",
    "agent_platform.core.runtime.run_context -> agent_platform.domain.run_context",
    "agent_platform.core.orchestration.outbox -> agent_platform.application.side_effects.outbox",
]

[[tool.importlinter.contracts]]
name = "Agent 之间互相隔离"
type = "independence"
modules = [
    "agent_platform.agents.stock_recap",
]

[[tool.importlinter.contracts]]
name = "adapters 仅依赖 runtime / core / 旧入口适配层"
type = "forbidden"
source_modules = [
    "agent_platform.adapters.wecom",
    "agent_platform.adapters.qq",
    "agent_platform.adapters.common",
]
forbidden_modules = [
    "agent_platform.infra",
    "agent_platform.infrastructure",
    "agent_platform.agents",
    "agent_platform.application",
]
# 例外：adapters.qq/wecom 通过 runtime.factory 间接触达 infra（预存问题）
ignore_imports = [
    "agent_platform.adapters.qq.__main__ -> agent_platform.runtime.factory",
    "agent_platform.adapters.qq.connector -> agent_platform.runtime",
    "agent_platform.adapters.wecom.__main__ -> agent_platform.runtime.factory",
    "agent_platform.adapters.wecom.connector -> agent_platform.runtime",
]
[[tool.importlinter.contracts]]
name = "tools_server 不得 import 任何 Agent"
type = "forbidden"
source_modules = ["agent_platform.tools_server"]
forbidden_modules = ["agent_platform.agents"]
