[project]
name = "agent-platform-infra"
version = "0.1.0"
description = "Agent Platform Infra — 默认端口实现（sqlite/llm/push/guardrail/memory）"
requires-python = ">=3.10"
dependencies = [
    "agent-platform-core>=0.1.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sqlite = []
qdrant = ["qdrant-client>=1.11.0"]
all = ["qdrant-client>=1.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]
only-include = [
    "src/agent_platform/infra",
    "src/agent_platform/runtime/observability",
    "src/agent_platform/resources",
    "src/agent_platform/skills",
]
