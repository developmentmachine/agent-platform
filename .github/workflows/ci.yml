name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Architecture boundaries (import-linter)
        run: lint-imports

      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stock-recap:ci .

      - name: Smoke test container
        run: |
          cleanup() {
            docker rm -f recap-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name recap-smoke \
            -e RECAP_DB_PATH=:memory: \
            -p 8000:8000 \
            stock-recap:ci

          for i in {1..30}; do
            if curl -fsS http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 2
          done

          docker logs recap-smoke
          exit 1

      - name: Validate compose config
        run: docker compose config

      - name: Smoke test docker compose
        run: |
          cleanup() {
            IMAGE_NAME=stock-recap:ci docker compose down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          IMAGE_NAME=stock-recap:ci \
          RECAP_DOCKER_DB_PATH=:memory: \
          docker compose up -d --no-build stock-recap

          for i in {1..30}; do
            if curl -fsS http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 2
          done

          IMAGE_NAME=stock-recap:ci docker compose logs stock-recap
          exit 1
