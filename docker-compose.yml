services:
  stock-recap:
    image: ${IMAGE_NAME:-agent-platform:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${RECAP_HTTP_PORT:-8000}:8000"
    environment:
      # 数据库与报告输出：默认持久化到 ./data。
      RECAP_DB_PATH: ${RECAP_DOCKER_DB_PATH:-/data/recap_system.db}
      RECAP_OUTPUT_DIR: ${RECAP_DOCKER_OUTPUT_DIR:-/data/reports}
      RECAP_LOG_LEVEL: ${RECAP_LOG_LEVEL:-INFO}

      # LLM 后端选择（openai / ollama / cursor-cli / gemini-cli）。
      RECAP_LLM_BACKEND: ${RECAP_LLM_BACKEND:-}
      RECAP_MODEL: ${RECAP_MODEL:-gpt-4o-mini}

      # API Keys：生产环境建议放入 .env，勿提交真实密钥。
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # API 安全与浏览器跨域。
      RECAP_API_KEY: ${RECAP_API_KEY:-}
      RECAP_CORS_ORIGINS: ${RECAP_CORS_ORIGINS:-}

      # 企业微信推送。
      RECAP_PUSH_ENABLED: ${RECAP_PUSH_ENABLED:-false}
      RECAP_WXWORK_WEBHOOK_URL: ${RECAP_WXWORK_WEBHOOK_URL:-}

      # 定时任务。
      RECAP_SCHEDULER_ENABLED: ${RECAP_SCHEDULER_ENABLED:-false}
      RECAP_SCHEDULER_DAILY_HOUR: ${RECAP_SCHEDULER_DAILY_HOUR:-15}
      RECAP_SCHEDULER_DAILY_MINUTE: ${RECAP_SCHEDULER_DAILY_MINUTE:-30}

      # 可选向量记忆（如使用远程 Qdrant）。
      RECAP_QDRANT_URL: ${RECAP_QDRANT_URL:-}
      RECAP_QDRANT_API_KEY: ${RECAP_QDRANT_API_KEY:-}
      RECAP_QDRANT_COLLECTION: ${RECAP_QDRANT_COLLECTION:-agent_platform_memory}

      # QQ 机器人。
      QQ_BOT_ENABLED: ${QQ_BOT_ENABLED:-true}
      QQ_BOT_APP_ID: ${QQ_BOT_APP_ID:-}
      QQ_BOT_CLIENT_SECRET: ${QQ_BOT_CLIENT_SECRET:-}
      QQ_BOT_USER_ID: ${QQ_BOT_USER_ID:-}
      QQ_BOT_RECAP_PROVIDER: ${QQ_BOT_RECAP_PROVIDER:-live}
      QQ_BOT_RECAP_FORCE_LLM: ${QQ_BOT_RECAP_FORCE_LLM:-true}
      QQ_BOT_RECAP_MODEL: ${QQ_BOT_RECAP_MODEL:-}
      QQ_BOT_RECAP_SKIP_TRADING_CHECK: ${QQ_BOT_RECAP_SKIP_TRADING_CHECK:-false}

    volumes:
      - ./data:/data

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  qq-bot:
    image: ${IMAGE_NAME:-agent-platform:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["agent-platform-qq-bot"]
    environment:
      # 共享环境变量。
      RECAP_DB_PATH: ${RECAP_DOCKER_DB_PATH:-/data/recap_system.db}
      RECAP_OUTPUT_DIR: ${RECAP_DOCKER_OUTPUT_DIR:-/data/reports}
      RECAP_LOG_LEVEL: ${RECAP_LOG_LEVEL:-INFO}

      RECAP_LLM_BACKEND: ${RECAP_LLM_BACKEND:-}
      RECAP_MODEL: ${RECAP_MODEL:-gpt-4o-mini}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # QQ 机器人专用变量。
      QQ_BOT_ENABLED: ${QQ_BOT_ENABLED:-true}
      QQ_BOT_APP_ID: ${QQ_BOT_APP_ID:-}
      QQ_BOT_CLIENT_SECRET: ${QQ_BOT_CLIENT_SECRET:-}
      QQ_BOT_USER_ID: ${QQ_BOT_USER_ID:-}
      QQ_BOT_RECAP_PROVIDER: ${QQ_BOT_RECAP_PROVIDER:-live}
      QQ_BOT_RECAP_FORCE_LLM: ${QQ_BOT_RECAP_FORCE_LLM:-true}
      QQ_BOT_RECAP_MODEL: ${QQ_BOT_RECAP_MODEL:-}
      QQ_BOT_RECAP_SKIP_TRADING_CHECK: ${QQ_BOT_RECAP_SKIP_TRADING_CHECK:-false}

    volumes:
      - ./data:/data

    restart: unless-stopped
    depends_on:
      - stock-recap
